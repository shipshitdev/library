name: Generate Marketplace Bundles

on:
  push:
    branches:
      - master
    paths:
      - 'skills/**'
      - 'commands/**'
      - 'bundles/**'
      - '.claude-plugin/marketplace.json'
      - 'package.json'
      - 'bun.lock'
      - 'biome.json'
      - '.markdownlint.json'
      - '.markdownlintignore'
      - '.github/workflows/generate-bundles.yml'
      - 'scripts/plugin-categories.json'
      - 'scripts/generate-marketplace-bundles.js'
      - 'scripts/generate-marketplace-json.js'
      - 'scripts/validate-skill-sync.sh'

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Validate skills
        run: bun run validate

      - name: Audit dependencies
        run: bun audit

      - name: Generate marketplace bundles
        run: bun run marketplace:generate

      - name: Verify generated bundles are current
        run: |
          git diff --exit-code -- bundles/ .claude-plugin/marketplace.json
